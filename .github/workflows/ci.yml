name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/pb-agent

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  npm-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check npm/pb-agent/bin/pb-agent.js
      - run: node scripts/package-npm.mjs 0.0.0-ci
      - run: npm pack --dry-run ./dist/npm/pb-agent

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
      - name: Install the current prerelease
        run: |
          PB_AGENT_INSTALL_DIR="$RUNNER_TEMP/pb-agent-bin" sh install.sh v0.1.0-rc.4
          "$RUNNER_TEMP/pb-agent-bin/pb-agent" version
